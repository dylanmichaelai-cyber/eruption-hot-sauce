name: YouTube Comment Digest

on:
  schedule:
    - cron: "0 8 * * 1"   # Every Monday at 8:00 AM UTC
  workflow_dispatch:        # Allow manual runs from the GitHub Actions tab

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch YouTube comments
        env:
          YOUTUBE_API_KEY:    ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_DAYS_BACK:  "7"
          YOUTUBE_MAX_COMMENTS: "100"
        run: |
          python3 scripts/fetch_youtube_comments.py > /tmp/comments.json
          echo "Fetched $(python3 -c "import json,sys; d=json.load(open('/tmp/comments.json')); print(sum(v['comment_count'] for v in d.get('videos', [])))")" comments

      - name: Analyse and send email
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:      ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:    ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          cat /tmp/comments.json | python3 scripts/analyze_and_email.py
